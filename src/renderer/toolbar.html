<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Layout Screen Ruler</title>
    <link rel="stylesheet" href="toolbar.css" />
  </head>
  <body>
    <div id="root" class="dir-down">
      <div class="bar" role="toolbar">
        <div class="grip" id="grip" data-title="dragHandle">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico fill">
            <circle cx="9" cy="6" r="1.6" />
            <circle cx="15" cy="6" r="1.6" />
            <circle cx="9" cy="12" r="1.6" />
            <circle cx="15" cy="12" r="1.6" />
            <circle cx="9" cy="18" r="1.6" />
            <circle cx="15" cy="18" r="1.6" />
          </svg>
        </div>

        <button type="button" class="tool" id="btn-spacing" data-panel="spacing" data-title="spacingTip" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico">
            <path d="M4 4v16M20 4v16" />
            <path d="M7.5 12h9" />
            <path d="m10 9-3 3 3 3M14 9l3 3-3 3" />
          </svg>
          <span data-text="spacing"></span>
        </button>

        <button type="button" class="tool" id="btn-color" data-panel="color" data-title="colorTip" aria-expanded="false">
          <span class="swatch" id="color-swatch" aria-hidden="true"></span>
          <span data-text="color"></span>
        </button>

        <button type="button" class="tool" id="btn-distance" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico">
            <rect x="2.5" y="7" width="19" height="10" rx="2" />
            <path d="M6.5 7v4M10.5 7v2.5M14.5 7v4M18.5 7v2.5" />
          </svg>
          <span data-text="distance"></span>
          <span class="badge" id="distance-badge" hidden></span>
        </button>

        <button type="button" class="tool" id="btn-ruler" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico eye-on">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico eye-off">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
            <path d="M3 3l18 18" />
          </svg>
          <span id="ruler-label"></span>
        </button>

        <div class="sep" aria-hidden="true"></div>

        <button type="button" class="icon-btn" id="btn-minimize">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico">
            <path d="M5 12h14" />
          </svg>
        </button>

        <button type="button" class="icon-btn danger" id="btn-close" data-title="closeTip">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <section class="panel" id="panel-spacing" hidden>
        <header class="panel-head">
          <h2 data-text="spacingTitle"></h2>
          <label class="num-field">
            <input type="number" id="spacing-input" step="1" inputmode="numeric" />
            <span>px</span>
          </label>
        </header>
        <div class="slider-row">
          <button type="button" class="step" id="spacing-dec" data-title="decrease">−</button>
          <input type="range" id="spacing-range" step="1" />
          <button type="button" class="step" id="spacing-inc" data-title="increase">+</button>
        </div>
        <div class="label" data-text="presets"></div>
        <div class="chips" id="spacing-presets"></div>
        <p class="help" data-text="spacingHelp"></p>
        <p class="help note" id="physical-note" hidden></p>
      </section>

      <section class="panel" id="panel-color" hidden>
        <header class="panel-head">
          <h2 data-text="colorTitle"></h2>
        </header>
        <div class="swatches" id="color-presets"></div>
        <div class="color-row">
          <button type="button" class="custom-color" id="custom-color" data-title="customColor">
            <span class="rainbow" aria-hidden="true"></span>
            <span data-text="customColor"></span>
          </button>
          <input type="color" id="color-input" tabindex="-1" aria-hidden="true" />
          <input type="text" id="hex-input" maxlength="7" spellcheck="false" autocomplete="off" data-title="hexLabel" />
        </div>
        <div class="slider-row">
          <span class="label inline" data-text="opacity"></span>
          <input type="range" id="opacity-range" min="10" max="100" step="1" />
          <output id="opacity-value"></output>
        </div>
        <button type="button" class="link" id="color-reset" data-text="resetColor"></button>
      </section>
    </div>
    <script src="toolbar.js"></script>
  </body>
</html>
